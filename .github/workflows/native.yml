name: Native P0 Harness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install content-pinned MoonBit
        shell: pwsh
        run: ./scripts/install-toolchain.ps1
      - name: Run same local Harness
        shell: pwsh
        run: ./scripts/harness.ps1 -OutDir "$env:GITHUB_WORKSPACE/work/ci"
      - name: Collect benchmark
        shell: pwsh
        run: ./scripts/benchmark.ps1 -OutDir "$env:GITHUB_WORKSPACE/work/benchmark"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence
          path: |
            work/ci
            work/benchmark
